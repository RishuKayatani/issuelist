[package]
name = "issuelist"
version = "0.1.1"
edition = "2021"

authors = ["rk"]
description = "TUI for browsing GitHub issues with preview"
license = "MIT"
repository = "https://github.com/RishuKayatani/issuelist"
readme = "README.md"
keywords = ["tui", "github", "issues", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "issuelist"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
