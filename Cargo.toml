[package]
name = "issuelist"
version = "0.1.0"
edition = "2021"

authors = ["rk"]
license = "MIT"

[[bin]]
name = "issuelist"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
